# iCloud Drive in Files' sidebar, exported by boomerangd (see boomerangd/cloudprovider.py).
# libcloudproviders reads the "Cloud Providers" group: a file without it crashes its
# collector (0.4.0 reads error->message on a NULL error), so keep this group name.
[Cloud Providers]
BusName=io.github.melvincouwez.Boomerang.Daemon
ObjectPath=/io/github/melvincouwez/Boomerang/CloudProviders
